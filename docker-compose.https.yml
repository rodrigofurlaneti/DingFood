services:
  api:
    environment:
      Cors__AllowedOrigins__2: "https://9.205.156.87"
  frontend:
    # Compose >= 2.24.4. O edge agora expõe HTTP (80) e HTTPS (443) em portas separadas.
    ports: !override []
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
  edge:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro