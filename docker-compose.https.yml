services:
  api:
    environment:
      Cors__AllowedOrigins__0: "https://dingfood-prod.brazilsouth.cloudapp.azure.com"
      Cors__AllowedOrigins__1: "http://localhost:3000"
      Cors__AllowedOrigins__2: "http://localhost:5173"

  frontend:
    ports: !override []
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:v5.4.0
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    entrypoint: >
      /bin/sh -c "
      certbot certonly --webroot -w /var/www/certbot 
      --non-interactive --agree-tos 
      -d \$${CERTBOT_DOMAIN} 
      -m \$${CERTBOT_EMAIL}
      && while :; do sleep 12h & wait \$\$!; certbot renew --quiet; done
      "
    networks:
      - dingfood_network

  edge:
    image: haproxy:3.2-alpine
    container_name: edge
    restart: unless-stopped
    depends_on:
      - frontend
      - api
      - certbot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    networks:
      - dingfood_network

networks:
  dingfood_network:
    driver: bridge

volumes:
  certbot-www:
  letsencrypt: