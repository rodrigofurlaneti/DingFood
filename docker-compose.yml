services:
  api:
    image: ghcr.io/rodrigofurlaneti/dingfood-api:latest
    pull_policy: always 
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      Delivery__GoogleMapsApiKey: "${Delivery__GoogleMapsApiKey}"  
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "${MYSQL_CONNECTION_STRING}"
      Jwt__Secret: "${Jwt__Secret}"
      Jwt__Issuer: "SyncBar"
      Jwt__Audience: "SyncBar.Client"
      Cors__AllowedOrigins__0: "http://localhost"
      Cors__AllowedOrigins__1: "http://20.226.121.58:80"
    ports:
      - "81:8080"
    volumes:
      - syncbar-uploads:/app/wwwroot/uploads
      - syncbar-dataprotection-keys:/app/app_data/protecting-keys
      - syncbar-whatsapp-outbox:/app/data/whatsapp-outbox

  frontend:
    image: ghcr.io/rodrigofurlaneti/dingfood-frontend:latest
    pull_policy: always 
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  syncbar-uploads:
  syncbar-dataprotection-keys:
  syncbar-whatsapp-outbox: