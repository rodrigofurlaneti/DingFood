server {
    listen 80;
    listen 443 ssl;
    server_name 20.226.121.58;
    ssl_certificate /etc/letsencrypt/live/syncbar-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncbar-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    location / { try_files $uri $uri/ /index.html; }

    location = /health {
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api/health;
    }
    location /api/ {
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api/uploads/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
